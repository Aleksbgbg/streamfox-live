stages:
  - build
  - lint
  - test

backend-build:
  stage: build
  image: rust:latest
  needs: []
  script:
    - cd backend
    - cargo build

frontend-build:
  stage: build
  image: node:latest
  needs: []
  script:
    - cd frontend
    - npm install
    - npm run build

backend-format:
  stage: lint
  image: rust:latest
  needs: []
  script:
    - cd backend
    - cargo fmt --check

backend-clippy:
  stage: lint
  image: rust:latest
  needs: []
  script:
    - cd backend
    - cargo clippy -- -Dwarnings

frontend-format:
  stage: lint
  image: node:latest
  needs: []
  script:
    - cd frontend
    - npm install
    - npm run format:check

frontend-lint:
  stage: lint
  image: node:latest
  needs: []
  script:
    - cd frontend
    - npm install
    - npm run lint:check

backend-test:
  stage: test
  image: rust:latest
  needs: []
  script:
    - cd backend
    - cargo test
